<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>bleh</title>

<style>
body {
    margin: 0;
    height: 100vh;

    background: url('tote.gif') no-repeat center center fixed;
    background-size: cover;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* PANEL */
#sidePanel {
    position: fixed;
    top: 0;
    right: -300px;
    width: 300px;
    height: 100vh;
    background: #333;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    transition: right 0.3s ease;
    z-index: 1500;
}

/* PRZYCISK */
.openBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
}

/* POPUP */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.popup img {
    width: 400px;
}
</style>
</head>

<body>

<button class="openBtn" onclick="togglePanel()">☰</button>

<div id="sidePanel">
  <button onclick="togglePanel()">Zamknij</button>
  <h2>Panel boczny</h2>
  <p>Tu możesz dodać zawartość.</p>
</div>

<h2 onclick="openPopup()" style="cursor:pointer;">
Click me
</h2>

<div class="overlay" id="popup">
    <div class="popup">
        <h3>Love you bae</h3>
        <img src="tete.png" alt="">
        <br><br>
        <button onclick="closePopup()">Zamknij</button>
    </div>
</div>

<script>
function openPopup() {
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function togglePanel() {
    const panel = document.getElementById("sidePanel");
    panel.style.right = panel.style.right === "0px" ? "-300px" : "0px";
}
</script>

</body>
</html>
