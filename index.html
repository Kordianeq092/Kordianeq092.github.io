<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>bleh</title>

<style>
body {
    margin: 0;
    height: 100vh;

    background: url('tote.gif') no-repeat center center fixed;
    background-size: cover;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* PANEL */
#sidePanel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 400px;
    height: 100vh;
    background: #333;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    transition: right 0.3s ease;
    z-index: 1500;
}
    /* PRZYCISK LEWY */
.openLeftBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 2000;

    width: 60px;
    height: 60px;
    border: none;
    background: white;
    border-radius: 12px;
    cursor: pointer;
}
/* LEWITUJĄCY PANEL */
#leftPanel {
    position: fixed;
    top: 100px;
    left: -320px;          /* ukryty poza ekranem */
    width: 280px;
    padding: 20px;

    background: white;
    border-radius: 20px;   /* zaokrąglone rogi */
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* efekt lewitacji */

    transition: left 0.3s ease;
    z-index: 3000;
}
/* PRZYCISK */
.openBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
    background-color: white; /* tutaj ustawiasz kolor "marginesów" */
    border: none;          /* usuń obramowanie */
    padding: 0;            /* usuń padding */
    cursor: pointer;
    width: 60px;           /* szerokość przycisku */
    height: 60px;          /* wysokość przycisku */
}

/* POPUP */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.popup img {
    width: 400px;
}
    .openBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2000;
    padding: 10px 15px;
    font-size: 18px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
button {
    font-family: Arial, sans-serif;
    background: none;
    border: none;
    cursor: pointer;
    
}
.closeBtn {
    font-family: Arial, sans-serif;
    background: none;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
}
.closeBtn:focus {
    outline: none;
}
    #sidePanel li {
    margin-bottom: 10px; /* 10px odstępu między liniami */
}
    .panelImg {
    width: 400px;   /* konkretna szerokość */
}

</style>
</head>

<body>

<button class="openLeftBtn" onclick="toggleLeftPanel()"
    <img src="tetopic.png" alt="Menu" style="width:100%; height:100%; object-fit:cover;">
</button>
<button class="openBtn" onclick="togglePanel()">
    <img src="tetopic.png" alt="Menu" style="width:100%; height:100%; object-fit:cover;"> 
</button>
    <div id="leftPanel">
    <h2>Our Memories</h2>
    <p>bleh</p>
</div>


<div id="sidePanel">
    <button class="closeBtn" onclick="togglePanel()"></button>
    <font style="Arial"> 
  <h2>Reasons i love you</h2>
    <ul>
     <li>cuz you love me, obviously</li>
     <li>why not</li>
     <li>lowk you wanna spend as much time with me as you can</li>
     <li>you dont mind my nerdy ass</li>
     <li>because i said so</li>
    </ul>
        </font>
    <img src="whigga.png" alt="Obraz" class="panelImg">
</div>

<h2 onclick="openPopup()" style="cursor:pointer;">
Click me
</h2>

<div class="overlay" id="popup">
    <div class="popup">
        <h3>Love you bae</h3>
        <img src="tete.png" alt="">
        <br><br>
        <button onclick="closePopup()">it took me so long to code ts </button>
    </div>
</div>

<script>
    
    function toggleLeftPanel() {
    const panel = document.getElementById("leftPanel");
    panel.style.left = panel.style.left === "20px" ? "-320px" : "20px";
}

function openPopup() {
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

function togglePanel() {
    const panel = document.getElementById("sidePanel");
    panel.style.right = panel.style.right === "0px" ? "-400px" : "0px";
}
</script>

</body>
</html>
