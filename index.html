<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>bleh</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: url('tote.gif') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
    <button onclick="togglePanel()" style="position: fixed; top: 20px; right: 20px; z-index: 1001;">
  ☰ Otwórz panel
</button>

<div id="sidePanel" style="
    position: fixed;
    top: 0;
    right: -300px;
    width: 300px;
    height: 100vh;
    background: #333;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    transition: right 0.3s ease;
    z-index: 1001;
    overflow-y: auto;
">
  <button onclick="togglePanel()" style="background:none; border:none; color:white; font-size: 20px; cursor:pointer;">× Zamknij</button>
  <h2>Panel boczny</h2>
  <p>Tu możesz dodać dowolną zawartość.</p>
</div>

}


.overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}


.popup {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.popup img {
    width: 400px;
    margin-top: 10px;
}

.close {
    cursor: pointer;
    color: red;
    margin-top: 10px;
    display: block;
}
</style>
</head>
<body>

<h2 onclick="openPopup()" style="cursor:pointer; color:black;">
click me nigga
</h2>

<div class="overlay" id="popup">
    <div class="popup">
        <h3>Love you bae</h3>
        <img src="tete.png" alt="Obrazek">
        <span class="close" onclick="closePopup()">i coded this for so long fr </3</span>
    </div>
</div>

<script>
function openPopup() {
    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}
    function togglePanel() {
  const panel = document.getElementById('sidePanel');
  if (panel.style.right === '0px') {
    panel.style.right = '-300px';
  } else {
    panel.style.right = '0px';
  }
}

</script>

</body>
</html>
