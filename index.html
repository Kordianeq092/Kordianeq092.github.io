<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>bleh</title>

<style>

/* ===================== BODY ===================== */
body {
    margin: 0;
    height: 100vh;
    background: url('tote.gif') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ===================== RIGHT PANEL ===================== */
#sidePanel {
    position: fixed;
    top: 0;
    right: -400px;
    width: 400px;
    height: 100vh;
    background: #333;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    transition: right 0.3s ease;
    z-index: 1500;
}

.openBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border: none;
    padding: 0;
    cursor: pointer;
    z-index: 2000;
}

.openBtn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ===================== LEFT FLOATING PANEL ===================== */
.openLeftBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    border: none;
    padding: 0;
    cursor: pointer;
    z-index: 3000;
}

.openLeftBtn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#leftPanel {
    position: fixed;
    top: 100px;
    left: -320px;
    width: 280px;
    padding: 20px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    transition: left 0.3s ease;
    z-index: 2500;
}

/* ===================== MEMORIES GRID ===================== */
.photoGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    perspective: 1000px;
}

.photoItem {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    height: 120px;
    cursor: pointer;
    transition: transform 0.1s ease;
    transform-style: preserve-3d;
    background: white;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.photoItem img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photoCaption {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.photoItem:hover .photoCaption {
    opacity: 1;
}

/* ===================== CENTER LIBRARY ===================== */
.mainLibrary {
    width: 800px;
    background: rgba(255,255,255,0.9);
    padding: 40px;
    border-radius: 30px;
    text-align: center;
}

.libraryGrid {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
}

.libraryCard {
    width: 130px;
    height: 130px;
    border-radius: 25px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    z-index: 1;
}

.libraryCard img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Expanded */
.libraryCard.active {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(2);
    width: 350px;
    height: 350px;
    z-index: 5000;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}

/* Overlay */
#dimOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    z-index: 4000;
}

</style>
</head>
<body>

<!-- LEFT BUTTON -->
<button class="openLeftBtn" onclick="toggleLeftPanel()">
    <img src="tetopic.png">
</button>

<!-- RIGHT BUTTON -->
<button class="openBtn" onclick="togglePanel()">
    <img src="tetopic.png">
</button>

<!-- LEFT PANEL -->
<div id="leftPanel">
    <h2>Our Memories</h2>
    <div class="photoGrid">

        <div class="photoItem">
            <img src="alex schor.png">
            <div class="photoCaption">your cute crashouts</div>
        </div>

        <div class="photoItem">
            <img src="apex legends.png">
            <div class="photoCaption">our favourite teammates</div>
        </div>

        <div class="photoItem">
            <img src="risk of rain 2.png">
            <div class="photoCaption">oneshots & crashes</div>
        </div>

        <div class="photoItem">
            <img src="bee swarm simulator.png">
            <div class="photoCaption">the grind you hate</div>
        </div>

    </div>
</div>

<!-- RIGHT PANEL -->
<div id="sidePanel">
    <h2>Reasons I love you</h2>
    <ul>
        <li>cuz you love me</li>
        <li>why not</li>
        <li>you spend time with me</li>
        <li>you accept my nerdy ass</li>
        <li>because i said so</li>
    </ul>
</div>

<!-- CENTER LIBRARY -->
<div class="mainLibrary">
    <h1>Our Library 🎮</h1>
    <div class="libraryGrid">

        <div class="libraryCard" onclick="expandCard(this)">
            <img src="apex legends.png">
        </div>

        <div class="libraryCard" onclick="expandCard(this)">
            <img src="risk of rain 2.png">
        </div>

        <div class="libraryCard" onclick="expandCard(this)">
            <img src="bee swarm simulator.png">
        </div>

        <div class="libraryCard" onclick="expandCard(this)">
            <img src="alex schor.png">
        </div>

    </div>
</div>

<div id="dimOverlay" onclick="closeCard()"></div>

<script>

/* RIGHT PANEL */
function togglePanel() {
    const panel = document.getElementById("sidePanel");
    panel.style.right = panel.style.right === "0px" ? "-400px" : "0px";
}

/* LEFT PANEL */
function toggleLeftPanel() {
    const panel = document.getElementById("leftPanel");
    panel.style.left = panel.style.left === "20px" ? "-320px" : "20px";
}

/* EXPAND LIBRARY CARD */
function expandCard(card) {
    document.getElementById("dimOverlay").style.display = "block";
    card.classList.add("active");
}

/* CLOSE */
function closeCard() {
    document.getElementById("dimOverlay").style.display = "none";
    document.querySelectorAll(".libraryCard").forEach(card => {
        card.classList.remove("active");
    });
}

/* 2.5D EFFECT FOR MEMORIES */
const cards = document.querySelectorAll(".photoItem");

cards.forEach(card => {
    card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = -(y - centerY) / 8;
        const rotateY = (x - centerX) / 8;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
    });

    card.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0) rotateY(0) scale(1)";
    });
});

</script>

</body>
</html>
